[package]
name = "tt-isa"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/zk4x/tt-isa"
homepage = "https://github.com/zk4x/tt-isa"
documentation = "https://docs.rs/tt-isa"
description = "Blackhole ISA: instruction encoders, register maps, coordinate spaces. no_std, no dependencies."

[dependencies]

# The two generated tables are produced by `cargo xtask`, not by a build script:
# the crate stays buildable for `riscv32im` with nothing but rustc, and a pin bump
# becomes a diff someone can read.
[workspace]
members = ["xtask"]
resolver = "2"
